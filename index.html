<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TopZen | ZenHQ Clan Community</title>

<!-- ================================================================
     الإعداد قبل الاستخدام (مرة وحدة بس):
     1) روح إلى https://console.firebase.google.com وسوّي مشروع مجاني جديد
     2) من القائمة الجانبية: Build > Authentication > Get Started > فعّل "Email/Password"
     3) من القائمة الجانبية: Build > Firestore Database > Create database (اختر test mode مبدئياً)
     4) من إعدادات المشروع (⚙️ Project settings) > Your apps > اختر Web (</>) 
        وسجّل تطبيق جديد، بيعطيك firebaseConfig — انسخه وحطه مكان القيم تحت
     5) شغّل الملف، سوّي أول حساب (هذا حسابك انت كصاحب الموقع)
     6) بعد الدخول بيطلع لك رقم UID فوق — انسخه وحطه في متغير OWNER_UID تحت
     7) روح Firestore Database > Rules، وانسخ الصق القواعد المذكورة في نهاية
        هذا الملف (بأسفل التعليقات) واضغط Publish
     ================================================================ -->

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 20% 0%, rgba(124,58,237,0.16), transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(168,85,247,0.12), transparent 40%),
                #07040f;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    color: #f3e8ff;
    min-height: 100vh;
  }
  .en { font-family: 'Courier New', monospace; letter-spacing: 0.2em; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 0 20px 100px; }
  .center { text-align: center; }
  .eyebrow { color: #a78bfa; font-size: 11px; letter-spacing: 0.3em; margin-bottom: 10px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity:.4 } 50% { opacity:1 } }
  h1 { font-size: 34px; font-weight: 900; color: #fff; margin: 6px 0; }
  .glow { color: #c084fc; text-shadow: 0 0 22px rgba(168,85,247,0.75), 0 0 46px rgba(168,85,247,0.35); }
  .sub { color: rgba(216,180,254,0.55); font-size: 14px; margin-top: 8px; line-height: 1.6; }
  .card { background: linear-gradient(160deg, rgba(30,14,54,0.75), rgba(12,7,24,0.85)); border: 1px solid rgba(139,92,246,0.25); border-radius: 16px; padding: 18px; }
  .field { margin-bottom: 12px; text-align: right; }
  .field label { display:block; font-size: 12px; color: #c4b5fd; margin-bottom: 6px; }
  input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(139,92,246,0.4); color: #f3e8ff; border-radius: 10px; padding: 13px 14px; font-size: 14px; outline: none; font-family: inherit; }
  input:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,0.2); }
  input::placeholder { color: rgba(216,180,254,0.35); }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-main { width: 100%; background: linear-gradient(90deg,#7c3aed,#c026d3); color: #fff; font-weight: 800; font-size: 15px; padding: 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(124,58,237,0.35); margin-top: 4px; }
  .login-page { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
  .login-box { width: 100%; max-width: 380px; box-shadow: 0 0 60px rgba(139,92,246,0.15); }
  .switch-mode { text-align:center; margin-top: 14px; font-size: 13px; color: #c4b5fd; }
  .switch-mode span { color: #e9d5ff; font-weight: 800; text-decoration: underline; cursor:pointer; }
  .gate { margin: 20px 0; }
  .gate p { font-size: 14px; color: #ddd6fe; line-height: 1.7; margin-bottom: 12px; }
  .gate-form { display:flex; gap: 8px; }
  .gate-form input { flex: 1; }
  .gate-form button { padding: 0 18px; background: #7c3aed; color:#fff; font-weight:800; border-radius: 10px; font-size:14px; }
  .leader { text-align:center; margin: 22px 0 18px; }
  .leader .eyebrow { margin-bottom: 6px; }
  .leader-name { font-size: 22px; font-weight: 900; color: #fff; display:flex; align-items:center; justify-content:center; gap:10px; }
  .avatar { border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#0a0614; flex-shrink:0; }
  .tabs { display:flex; gap:6px; background: linear-gradient(160deg, rgba(30,14,54,0.75), rgba(12,7,24,0.85)); border:1px solid rgba(139,92,246,0.25); border-radius: 999px; padding: 5px; margin-bottom: 16px; }
  .tab-btn { flex:1; padding: 11px; border-radius: 999px; font-weight: 800; font-size: 14px; background: transparent; color: #c4b5fd; }
  .tab-btn.active { background: linear-gradient(90deg,#7c3aed,#c026d3); color: #fff; }
  .list { display:flex; flex-direction:column; gap: 8px; }
  .row { display:flex; align-items:center; gap: 12px; background: linear-gradient(160deg, rgba(30,14,54,0.75), rgba(12,7,24,0.85)); border: 1px solid rgba(139,92,246,0.25); border-radius: 14px; padding: 12px; }
  .rank { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; flex-shrink:0; background: rgba(139,92,246,0.12); color:#c4b5fd; border:1px solid rgba(139,92,246,0.3); }
  .row-name { font-weight: 800; color: #fff; font-size: 14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .row-info { flex: 1; min-width: 0; }
  .medal-label { font-size: 10px; letter-spacing: 0.05em; font-family:'Courier New',monospace; margin-top:2px; }
  .you-badge { font-size: 10px; background: rgba(147,51,234,0.4); color: #e9d5ff; padding: 2px 7px; border-radius: 999px; }
  .row-val { text-align:left; }
  .row-val .num { font-size: 18px; font-weight: 900; color:#fff; }
  .row-val .unit { font-size: 10px; color: rgba(196,181,253,0.6); }
  .row-del { background:none; color:#f87171; font-size:14px; padding: 0 4px; }
  .empty { text-align:center; padding: 26px; color: rgba(216,180,254,0.45); font-size: 14px; }
  .locked { opacity: 0.35; pointer-events: none; user-select: none; }
  .admin-panel { margin-top: 24px; display:flex; flex-direction:column; gap: 12px; }
  .admin-title { color: #a78bfa; font-size: 12px; letter-spacing: 0.15em; font-family:'Courier New',monospace; }
  .stack { display:flex; flex-direction:column; gap: 8px; }
  .row-btns { display:flex; gap:8px; }
  .row-btns input { flex:1; }
  .row-btns button { padding: 0 14px; background:#7c3aed; color:#fff; font-weight:800; border-radius:10px; font-size:13px; }
  .btn-secondary { width:100%; padding: 12px; border-radius:10px; font-size:13px; font-weight:800; color:#c4b5fd; background:transparent; border:1px solid rgba(168,85,247,0.4); }
  .uid-box { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.4); border-radius: 12px; padding: 14px; margin: 16px 20px; font-size: 12px; line-height: 1.8; color: #d1fae5; word-break: break-all; }
  .uid-box b { color: #6ee7b7; }
  .members-toggle {
    position: fixed; top: 50%; left: 0; transform: translateY(-50%);
    background: linear-gradient(180deg,#7c3aed,#c026d3); color: #fff;
    font-weight: 800; font-size: 13px; padding: 14px 8px;
    border-radius: 0 12px 12px 0; writing-mode: vertical-rl; text-orientation: mixed;
    box-shadow: 4px 0 20px rgba(124,58,237,0.4); z-index: 45; letter-spacing: 0.05em;
  }
  .members-overlay {
    position: fixed; inset: 0; background: rgba(4,2,10,0.6); z-index: 46; display: none;
  }
  .members-overlay.open { display: block; }
  .members-panel {
    position: fixed; top: 0; left: 0; bottom: 0; width: 84%; max-width: 340px;
    background: linear-gradient(180deg, #140a28, #07040f);
    border-right: 1px solid rgba(139,92,246,0.3);
    z-index: 47; transform: translateX(-100%); transition: transform 0.25s ease;
    display: flex; flex-direction: column; padding: 18px 16px;
    overflow-y: auto;
  }
  .members-panel.open { transform: translateX(0); }
  .members-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; }
  .members-head h2 { font-size: 17px; font-weight: 900; color: #fff; }
  .members-close { background:none; color:#c4b5fd; font-size: 20px; padding: 4px 8px; }
  .member-row { background: linear-gradient(160deg, rgba(30,14,54,0.75), rgba(12,7,24,0.85)); border: 1px solid rgba(139,92,246,0.22); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .member-name { font-weight: 800; color: #fff; font-size: 13px; margin-bottom: 4px; display:flex; align-items:center; gap:6px; }
  .member-meta { font-size: 12px; color: #c4b5fd; line-height: 1.7; }
  .member-meta b { color: #e9d5ff; }
  .member-empty { color: rgba(216,180,254,0.5); font-size: 13px; text-align:center; padding: 20px; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background:#7c3aed; color:#fff; font-size:13px; padding: 10px 18px; border-radius: 999px; z-index: 50; box-shadow: 0 6px 20px rgba(124,58,237,0.4); text-align:center; max-width: 90%; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; padding: 14px 20px 0; font-size: 12px; color: #c4b5fd; }
  .logout-btn { background:none; color:#f87171; font-size:12px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  "use strict";

  // ============== 1) عبّي بيانات مشروعك من Firebase هنا ==============
  var firebaseConfig = {
    apiKey: "AIzaSyCiNBeAmpm8wctX7ZmpHy37KiakUFlxdEA",
    authDomain: "top-zen.firebaseapp.com",
    projectId: "top-zen",
    storageBucket: "top-zen.firebasestorage.app",
    messagingSenderId: "29988590450",
    appId: "1:29988590450:web:27b153413903cc933143eb",
    measurementId: "G-5QSG7KQSHB"
  };

  // تفعيل الاتصال بمشروع Firebase
  firebase.initializeApp(firebaseConfig);

  // ============== 2) بعد أول حساب تسوّيه، حط الـ UID هنا عشان تصير أدمن ==============
  var OWNER_UID = "PASTE_YOUR_UID_HERE_AFTER_FIRST_SIGNUP";
  // =====================================================================

  var configReady = firebaseConfig.apiKey.indexOf("PASTE_") === -1;

  var root = document.getElementById("root");

  var state = {
    booting: true,
    user: null,        // { uid, email, roblox, discord, displayName }
    isAdmin: false,
    site: { clanLeader: "ZenHQ", kills: [], clan: [] },
    tab: "kills",
    mode: "signup",     // 'signup' | 'signin'
    toast: "",
    showMembers: false,
    members: []
  };

  function esc(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function flash(msg) {
    state.toast = msg;
    render();
    setTimeout(function () { state.toast = ""; render(); }, 2200);
  }
  function hashHue(str) {
    var h = 0; str = str || "zen";
    for (var i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
    return Math.abs(h) % 360;
  }
  function avatarHTML(name, size) {
    size = size || 44;
    var letter = esc((name || "?").trim().charAt(0).toUpperCase() || "?");
    var hue = hashHue(name);
    var style = "width:" + size + "px;height:" + size + "px;font-size:" + Math.round(size * 0.42) +
      "px;background:linear-gradient(140deg, hsl(" + hue + ",85%,72%), hsl(" + ((hue + 40) % 360) + ",85%,58%));box-shadow:0 0 0 2px rgba(168,85,247,0.35);";
    return '<div class="avatar" style="' + style + '">' + letter + "</div>";
  }
  var MEDALS = [
    { ring: "#fbbf24", glow: "rgba(251,191,36,0.55)", label: "GOLD", text: "#3a2a06" },
    { ring: "#d6dbe3", glow: "rgba(214,219,227,0.45)", label: "SILVER", text: "#26262c" },
    { ring: "#d97706", glow: "rgba(217,119,6,0.45)", label: "BRONZE", text: "#2e1a04" }
  ];
  function rankHTML(i) {
    var m = MEDALS[i];
    if (m) return '<div class="rank" style="background:' + m.ring + ";color:" + m.text + ";box-shadow:0 0 16px " + m.glow + ';">' + (i + 1) + "</div>";
    return '<div class="rank">' + (i + 1) + "</div>";
  }

  // ---------------- config-missing screen ----------------
  function configMissingHTML() {
    return '<div class="login-page"><div class="card login-box">' +
      '<div class="eyebrow en">SETUP REQUIRED</div>' +
      '<h1 style="font-size:22px;">لسا ما ربطت Firebase</h1>' +
      '<p class="sub" style="text-align:right;">افتح هذا الملف بمحرر نصوص، ودوّر على "PASTE_YOUR_API_KEY" أعلى الملف بالسكربت، وحط بيانات مشروعك من Firebase Console (Project settings → Your apps). التعليمات كاملة مكتوبة بأعلى الملف.</p>' +
      "</div></div>";
  }

  // ---------------- auth screen ----------------
  function authHTML() {
    var isSignup = state.mode === "signup";
    var html = '<div class="login-page"><div class="card login-box">';
    html += '<div class="center"><div class="eyebrow en">TOPZEN CLAN COMMUNITY</div>';
    html += "<h1>أهلاً بك في <span class=\"glow en\">TopZen</span></h1>";
    html += '<p class="sub">' + (isSignup ? "أنشئ حسابك عشان تدخل مجتمع الكلان" : "سجّل دخولك للمتابعة") + "</p></div>";
    html += '<form id="auth-form" style="margin-top:20px;">';
    html += '<div class="field"><label>البريد الإلكتروني</label><input id="in-email" type="email" placeholder="you@example.com" autocomplete="off"/></div>';
    html += '<div class="field"><label>كلمة السر</label><input id="in-pass" type="password" placeholder="6 أحرف على الأقل" autocomplete="off"/></div>';
    if (isSignup) {
      html += '<div class="field"><label>اسم المستخدم في Roblox</label><input id="in-roblox" placeholder="مثال: ZenPlayer123" autocomplete="off"/></div>';
      html += '<div class="field"><label>اسم المستخدم في Discord</label><input id="in-discord" placeholder="مثال: zen#0001" autocomplete="off"/></div>';
    }
    html += '<button type="submit" class="btn-main">' + (isSignup ? "إنشاء الحساب والدخول" : "تسجيل الدخول") + "</button>";
    html += "</form>";
    html += '<div class="switch-mode">' + (isSignup ? "عندك حساب؟ <span id=\"toggle-mode\">سجّل دخول</span>" : "ما عندك حساب؟ <span id=\"toggle-mode\">أنشئ حساب</span>") + "</div>";
    html += "</div></div>";
    return html;
  }

  function bindAuth() {
    var toggle = document.getElementById("toggle-mode");
    if (toggle) toggle.addEventListener("click", function () {
      state.mode = state.mode === "signup" ? "signin" : "signup";
      render();
    });
    var form = document.getElementById("auth-form");
    if (form) {
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("in-email").value.trim();
        var pass = document.getElementById("in-pass").value;
        if (!email || pass.length < 6) { flash("عبّي الإيميل وكلمة سر 6 أحرف على الأقل"); return; }

        if (state.mode === "signup") {
          var roblox = document.getElementById("in-roblox").value.trim();
          var discord = document.getElementById("in-discord").value.trim();
          if (!roblox || !discord) { flash("عبّي اسمي روبلوكس وديسكورد"); return; }
          firebase.auth().createUserWithEmailAndPassword(email, pass).then(function (cred) {
            return firebase.firestore().collection("users").doc(cred.user.uid).set({
              email: email, roblox: roblox, discord: discord, displayName: ""
            });
          }).catch(function (err) { flash(err.message); });
        } else {
          firebase.auth().signInWithEmailAndPassword(email, pass).catch(function (err) { flash(err.message); });
        }
      });
    }
  }

  // ---------------- main app ----------------
  function mainHTML() {
    var locked = !state.user.displayName;
    var html = "";

    html += '<div class="top-bar"><span class="en">' + esc(state.user.email) + '</span><button id="logout-btn" class="logout-btn">خروج</button></div>';

    if (state.isAdmin) {
      html += '<button id="members-toggle" class="members-toggle">الأعضاء 👥</button>';
      html += '<div id="members-overlay" class="members-overlay ' + (state.showMembers ? "open" : "") + '"></div>';
      html += '<div class="members-panel ' + (state.showMembers ? "open" : "") + '">';
      html += '<div class="members-head"><h2>أعضاء الموقع (' + state.members.length + ')</h2><button id="members-close" class="members-close">✕</button></div>';
      if (!state.members.length) {
        html += '<div class="member-empty">ما فيه أعضاء مسجلين بعد</div>';
      } else {
        state.members.forEach(function (m) {
          html += '<div class="member-row"><div class="member-name">' + avatarHTML(m.displayName || m.email, 28) + esc(m.displayName || "بدون اسم بعد") + "</div>";
          html += '<div class="member-meta">Roblox: <b>' + esc(m.roblox || "—") + '</b><br/>Discord: <b>' + esc(m.discord || "—") + '</b><br/>' + esc(m.email || "") + "</div></div>";
        });
      }
      html += "</div>";
    }

    if (state.isAdmin) {
      html += '<div class="uid-box"><b>أنت مدير الموقع ✓</b><br/>UID: ' + esc(state.user.uid) + "</div>";
    } else if (OWNER_UID.indexOf("PASTE_") !== -1) {
      html += '<div class="uid-box"><b>خطوة الإعداد الأخيرة:</b><br/>انسخ الكود تحت وحطه في متغير OWNER_UID أعلى الملف حتى تصير أنت مدير الموقع:<br/><b>' + esc(state.user.uid) + "</b></div>";
    }

    html += '<div class="wrap">';
    html += '<div class="center" style="padding-top:8px;padding-bottom:18px;">';
    html += '<div class="eyebrow en">TOPZEN CLAN COMMUNITY <span class="dot"></span></div>';
    html += '<h1>توب <span class="glow en">ZEN</span></h1>';
    html += '<p class="sub">تابع أفضل اللاعبين، القتلات، والترتيب العام لأعضاء الكلان</p>';
    html += "</div>";

    if (locked) {
      html += '<div class="card gate">';
      html += "<p>حسابك مرتبط ✓ Roblox: <b style=\"color:#fff\">" + esc(state.user.roblox) + "</b> — Discord: <b style=\"color:#fff\">" + esc(state.user.discord) + "</b><br/><span style=\"color:#c4b5fd\">خطوة أخيرة قبل ما تقدر تتفاعل مع الموقع:</span></p>";
      html += '<form id="name-form" class="gate-form"><input id="in-name" placeholder="اكتب اسمك" autocomplete="off"/><button type="submit">حفظ</button></form></div>';
    }

    html += '<div class="' + (locked ? "locked" : "") + '">';
    html += '<div class="leader"><div class="eyebrow en" style="justify-content:center;">LEADER OF THE CLAN</div>';
    html += '<div class="leader-name">' + avatarHTML(state.site.clanLeader, 34) + esc(state.site.clanLeader) + "</div></div>";

    html += '<div class="tabs">';
    html += '<button class="tab-btn ' + (state.tab === "kills" ? "active" : "") + '" data-tab="kills">🗡️ توب كيل</button>';
    html += '<button class="tab-btn ' + (state.tab === "clan" ? "active" : "") + '" data-tab="clan">🏆 ليدربورد الكلان</button>';
    html += "</div>";

    var list = state.tab === "kills" ? state.site.kills : state.site.clan;
    html += '<div class="list">';
    if (!list || list.length === 0) {
      html += '<div class="empty">لا توجد بيانات بعد</div>';
    } else {
      list.forEach(function (item, i) {
        var m = MEDALS[i];
        var val = state.tab === "kills" ? item.kills : item.points;
        var unit = state.tab === "kills" ? "قتلة" : "نقطة";
        var mine = state.user.displayName && item.name === state.user.displayName;
        var rowStyle = m ? ("box-shadow:0 0 20px " + m.glow + ";border-color:" + m.ring + ";") : "";
        html += '<div class="row" style="' + rowStyle + '">';
        html += rankHTML(i) + avatarHTML(item.name, 44);
        html += '<div class="row-info"><div class="row-name">' + esc(item.name);
        if (mine) html += '<span class="you-badge">أنت</span>';
        html += "</div>";
        if (m) html += '<div class="medal-label" style="color:' + m.ring + ';">' + m.label + "</div>";
        html += "</div>";
        html += '<div class="row-val"><div class="num">' + val + '</div><div class="unit">' + unit + "</div></div>";
if (state.isAdmin) html += '<button class="row-del" data-del="' + item.id + '" data-kind="' + state.tab + '">✕</button>';
html += "</div>";
});
}
html += "</div></div>";
if (state.isAdmin) {
html += '<div class="admin-panel"><div class="admin-title">لوحة تحكم المدير</div>';
html += '<div class="stack">';
html += '<div class="row-btns"><input id="adm-leader" placeholder="اسم قائد الكلان" value="' + esc(state.site.clanLeader) + '"/><button id="btn-set-leader">حفظ القائد</button></div>';
html += '<div class="row-btns"><input id="adm-k-name" placeholder="الاسم"/><input id="adm-k-val" type="number" placeholder="القتلات"/><button id="btn-add-kill">إضافة لقتلات</button></div>';
html += '<div class="row-btns"><input id="adm-c-name" placeholder="الاسم"/><input id="adm-c-val" type="number" placeholder="النقاط"/><button id="btn-add-clan">إضافة للكلان</button></div>';
html += "</div></div>";
}
html += "</div>";
return html;
}
function bindMain() {
var logoutBtn = document.getElementById("logout-btn");
if (logoutBtn) logoutBtn.addEventListener("click", function () { firebase.auth().signOut(); });
var nameForm = document.getElementById("name-form");
if (nameForm) {
nameForm.addEventListener("submit", function (e) {
e.preventDefault();
var val = document.getElementById("in-name").value.trim();
if (!val) return;
firebase.firestore().collection("users").doc(state.user.uid).update({ displayName: val }).then(function () {
state.user.displayName = val;
render();
}).catch(function (err) { flash(err.message); });
});
}
var tabs = document.querySelectorAll(".tab-btn");
tabs.forEach(function (btn) {
btn.addEventListener("click", function () {
state.tab = btn.getAttribute("data-tab");
render();
});
});
var memToggle = document.getElementById("members-toggle");
var memClose = document.getElementById("members-close");
var memOverlay = document.getElementById("members-overlay");
if (memToggle) memToggle.addEventListener("click", function () { state.showMembers = true; render(); });
if (memClose) memClose.addEventListener("click", function () { state.showMembers = false; render(); });
if (memOverlay) memOverlay.addEventListener("click", function () { state.showMembers = false; render(); });
if (!state.isAdmin) return;
var btnLeader = document.getElementById("btn-set-leader");
if (btnLeader) {
btnLeader.addEventListener("click", function () {
var v = document.getElementById("adm-leader").value.trim();
if (!v) return;
firebase.firestore().collection("site").doc("main").set({ clanLeader: v }, { merge: true }).then(function () {
flash("تم تحديث اسم القائد");
});
});
}
var btnKill = document.getElementById("btn-add-kill");
if (btnKill) {
btnKill.addEventListener("click", function () {
var n = document.getElementById("adm-k-name").value.trim();
var k = parseInt(document.getElementById("adm-k-val").value, 10);
if (!n || isNaN(k)) return;
firebase.firestore().collection("kills").add({ name: n, kills: k, createdAt: Date.now() }).then(function () {
flash("تمت الإضافة للقتلات");
});
});
}
var btnClan = document.getElementById("btn-add-clan");
if (btnClan) {
btnClan.addEventListener("click", function () {
var n = document.getElementById("adm-c-name").value.trim();
var p = parseInt(document.getElementById("adm-c-val").value, 10);
if (!n || isNaN(p)) return;
firebase.firestore().collection("clan").add({ name: n, points: p, createdAt: Date.now() }).then(function () {
flash("تمت الإضافة للكلان");
});
});
}
var dels = document.querySelectorAll("[data-del]");
dels.forEach(function (btn) {
btn.addEventListener("click", function () {
var id = btn.getAttribute("data-del");
var kind = btn.getAttribute("data-kind");
firebase.firestore().collection(kind).doc(id).delete().then(function () {
flash("تم الحذف");
});
});
});
}
function render() {
var html = "";
if (!configReady) {
html = configMissingHTML();
} else if (state.booting) {
html = '<div class="login-page"><div class="eyebrow en"><span class="dot"></span> LOADING...</div></div>';
} else if (!state.user) {
html = authHTML();
} else {
html = mainHTML();
}
if (state.toast) {
html += '<div class="toast">' + esc(state.toast) + "</div>";
}
root.innerHTML = html;
if (!configReady || state.booting) return;
if (!state.user) bindAuth();
else bindMain();
}
render();
if (!configReady) return;
firebase.auth().onAuthStateChanged(function (u) {
if (!u) {
state.user = null;
state.isAdmin = false;
state.booting = false;
render();
return;
}
var isOwner = (u.uid === OWNER_UID);
state.isAdmin = isOwner;
firebase.firestore().collection("users").doc(u.uid).get().then(function (doc) {
var data = doc.data() || {};
state.user = {
uid: u.uid,
email: u.email,
roblox: data.roblox || "",
discord: data.discord || "",
displayName: data.displayName || ""
};
state.booting = false;
render();
listenData();
if (isOwner) listenMembers();
}).catch(function (err) {
console.error(err);
state.user = { uid: u.uid, email: u.email, roblox: "", discord: "", displayName: "" };
state.booting = false;
render();
});
});
function listenData() {
firebase.firestore().collection("site").doc("main").onSnapshot(function (doc) {
if (doc.exists) {
state.site.clanLeader = doc.data().clanLeader || "ZenHQ";
render();
}
});
firebase.firestore().collection("kills").onSnapshot(function (snap) {
var arr = [];
snap.forEach(function (d) { arr.push(Object.assign({ id: d.id }, d.data())); });
arr.sort(function (a, b) { return (b.kills || 0) - (a.kills || 0); });
state.site.kills = arr;
render();
});
firebase.firestore().collection("clan").onSnapshot(function (snap) {
var arr = [];
snap.forEach(function (d) { arr.push(Object.assign({ id: d.id }, d.data())); });
arr.sort(function (a, b) { return (b.points || 0) - (a.points || 0); });
state.site.clan = arr;
render();
});
}
function listenMembers() {
firebase.firestore().collection("users").onSnapshot(function (snap) {
var arr = [];
snap.forEach(function (d) { arr.push(Object.assign({ id: d.id }, d.data())); });
state.members = arr;
render();
});
}
})();
</script>
</body>
</html>
