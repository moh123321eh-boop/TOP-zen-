<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TopZen | ZenHQ Clan Community</title>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 20% 0%, rgba(5,150,105,0.16), transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(16,185,129,0.12), transparent 40%),
                #051109;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    color: #ecfdf5;
    min-height: 100vh;
  }
  .en { font-family: 'Courier New', monospace; letter-spacing: 0.2em; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 0 20px 100px; }
  .center { text-align: center; }
  .eyebrow { color: #34d399; font-size: 11px; letter-spacing: 0.3em; margin-bottom: 10px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity:.4 } 50% { opacity:1 } }
  h1 { font-size: 34px; font-weight: 900; color: #fff; margin: 6px 0; }
  .glow { color: #34d399; text-shadow: 0 0 22px rgba(16,185,129,0.75), 0 0 46px rgba(16,185,129,0.35); }
  .sub { color: rgba(167,243,208,0.55); font-size: 14px; margin-top: 8px; line-height: 1.6; }
  .card { background: linear-gradient(160deg, rgba(30,14,54,0.75), rgba(12,7,24,0.85)); border: 1px solid rgba(52,211,153,0.25); border-radius: 16px; padding: 18px; }
  .field { margin-bottom: 12px; text-align: left; }
  .field label { display:block; font-size: 12px; color: #6ee7b7; margin-bottom: 6px; }
  textarea { resize: vertical; }
  select option { background: #0c2016; color: #ecfdf5; }
  input, select, textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(52,211,153,0.4); color: #ecfdf5; border-radius: 10px; padding: 13px 14px; font-size: 14px; outline: none; font-family: inherit; }
  input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
  input::placeholder { color: rgba(167,243,208,0.35); }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-main { width: 100%; background: linear-gradient(90deg,#059669,#10b981); color: #fff; font-weight: 800; font-size: 15px; padding: 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(5,150,105,0.35); margin-top: 4px; }
  .login-page { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
  .login-box { width: 100%; max-width: 380px; box-shadow: 0 0 60px rgba(52,211,153,0.15); }
  .switch-mode { text-align:center; margin-top: 14px; font-size: 13px; color: #6ee7b7; }
  .switch-mode span { color: #a7f3d0; font-weight: 800; text-decoration: underline; cursor:pointer; }
  .gate { margin: 20px 0; }
  .gate p { font-size: 14px; color: #a7f3d0; line-height: 1.7; margin-bottom: 12px; }
  .gate-form { display:flex; gap: 8px; }
  .gate-form input { flex: 1; }
  .gate-form button { padding: 0 18px; background: #059669; color:#fff; font-weight:800; border-radius: 10px; font-size:14px; }
  .leader { text-align:center; margin: 22px 0 18px; }
  .leader .eyebrow { margin-bottom: 6px; }
  .leader-name { font-size: 22px; font-weight: 900; color: #fff; display:flex; align-items:center; justify-content:center; gap:10px; }
  .avatar { border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#07150d; flex-shrink:0; }
  .tabs { display:flex; gap:6px; background: linear-gradient(160deg, rgba(30,14,54,0.75), rgba(12,7,24,0.85)); border:1px solid rgba(52,211,153,0.25); border-radius: 999px; padding: 5px; margin-bottom: 16px; }
  .tab-btn { flex:1; padding: 11px; border-radius: 999px; font-weight: 800; font-size: 14px; background: transparent; color: #6ee7b7; }
  .tab-btn.active { background: linear-gradient(90deg,#059669,#10b981); color: #fff; }
  .list { display:flex; flex-direction:column; gap: 8px; }
  .row { display:flex; align-items:center; gap: 12px; background: linear-gradient(160deg, rgba(30,14,54,0.75), rgba(12,7,24,0.85)); border: 1px solid rgba(52,211,153,0.25); border-radius: 14px; padding: 12px; }
  .rank { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; flex-shrink:0; background: rgba(52,211,153,0.12); color:#6ee7b7; border:1px solid rgba(52,211,153,0.3); }
  .row-name { font-weight: 800; color: #fff; font-size: 14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .row-info { flex: 1; min-width: 0; }
  .medal-label { font-size: 10px; letter-spacing: 0.05em; font-family:'Courier New',monospace; margin-top:2px; }
  .you-badge { font-size: 10px; background: rgba(5,150,105,0.4); color: #a7f3d0; padding: 2px 7px; border-radius: 999px; }
  .row-val { text-align:right; }
  .row-val .num { font-size: 18px; font-weight: 900; color:#fff; }
  .row-val .unit { font-size: 10px; color: rgba(196,181,253,0.6); }
  .row-del { background:none; color:#f87171; font-size:14px; padding: 0 4px; }
  .empty { text-align:center; padding: 26px; color: rgba(167,243,208,0.45); font-size: 14px; }
  .locked { opacity: 0.35; pointer-events: none; user-select: none; }
  .admin-panel { margin-top: 24px; display:flex; flex-direction:column; gap: 12px; }
  .admin-title { color: #34d399; font-size: 12px; letter-spacing: 0.15em; font-family:'Courier New',monospace; }
  .stack { display:flex; flex-direction:column; gap: 8px; }
  .row-btns { display:flex; gap:8px; }
  .row-btns input { flex:1; }
  .row-btns button { padding: 0 14px; background:#059669; color:#fff; font-weight:800; border-radius:10px; font-size:13px; }
  .btn-secondary { width:100%; padding: 12px; border-radius:10px; font-size:13px; font-weight:800; color:#6ee7b7; background:transparent; border:1px solid rgba(16,185,129,0.4); }
  .uid-box { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.4); border-radius: 12px; padding: 14px; margin: 16px 20px; font-size: 12px; line-height: 1.8; color: #d1fae5; word-break: break-all; }
  .uid-box b { color: #6ee7b7; }
  .members-toggle {
    position: fixed; top: 50%; left: 0; transform: translateY(-50%);
    background: linear-gradient(180deg,#059669,#10b981); color: #fff;
    font-weight: 800; font-size: 13px; padding: 14px 8px;
    border-radius: 0 12px 12px 0; writing-mode: vertical-rl; text-orientation: mixed;
    box-shadow: 4px 0 20px rgba(5,150,105,0.4); z-index: 45; letter-spacing: 0.05em;
  }
  .members-overlay {
    position: fixed; inset: 0; background: rgba(4,2,10,0.6); z-index: 46; display: none;
  }
  .members-overlay.open { display: block; }
  .members-panel {
    position: fixed; top: 0; left: 0; bottom: 0; width: 84%; max-width: 340px;
    background: linear-gradient(180deg, #0c2016, #051109);
    border-right: 1px solid rgba(52,211,153,0.3);
    z-index: 47; transform: translateX(-100%); transition: transform 0.25s ease;
    display: flex; flex-direction: column; padding: 18px 16px;
    overflow-y: auto;
  }
  .members-panel.open { transform: translateX(0); }
  .members-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; }
  .members-head h2 { font-size: 17px; font-weight: 900; color: #fff; }
  .members-close { background:none; color:#6ee7b7; font-size: 20px; padding: 4px 8px; }
  .member-row { background: linear-gradient(160deg, rgba(30,14,54,0.75), rgba(12,7,24,0.85)); border: 1px solid rgba(52,211,153,0.22); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .member-name { font-weight: 800; color: #fff; font-size: 13px; margin-bottom: 4px; display:flex; align-items:center; gap:6px; }
  .member-meta { font-size: 12px; color: #6ee7b7; line-height: 1.7; }
  .member-meta b { color: #a7f3d0; }
  .member-empty { color: rgba(167,243,208,0.5); font-size: 13px; text-align:center; padding: 20px; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background:#059669; color:#fff; font-size:13px; padding: 10px 18px; border-radius: 999px; z-index: 50; box-shadow: 0 6px 20px rgba(5,150,105,0.4); text-align:center; max-width: 90%; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; padding: 14px 20px 0; font-size: 12px; color: #6ee7b7; }
  .logout-btn { background:none; color:#f87171; font-size:12px; }
</style>
</head>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyCiNBeAmpm8wctX7ZmpHy37KiakUFlxdEA",
    authDomain: "top-zen.firebaseapp.com",
    projectId: "top-zen",
    storageBucket: "top-zen.firebasestorage.app",
    messagingSenderId: "29988590450",
    appId: "1:29988590450:web:27b153413903cc933143eb"
  };
  var OWNER_UID = "HSfRw4AD0mfmRcLig5MWPhQGN7C2";
  var OWNER_EMAIL = "moh.123321eh@gmail.com";
  var BACKEND_URL = "https://us-central1-top-zen.cloudfunctions.net/api";

  var configReady = firebaseConfig.apiKey.indexOf("PASTE_") === -1;
  var root = document.getElementById("root");
  var db = null, unsubUser = null, unsubMembers = null, toastTimer = null;

  var state = {
    booting: true, user: null, isAdmin: false, isOwner: false,
    site: { clanLeader: "ZenHQ", kills: [], clan: [], admins: [], commands: [], guildId: "" },
    tab: "kills", mode: "signup", toast: "",
    showMembers: false, showMod: false, members: []
  };

  function esc(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function showToast() {
    var t = document.getElementById("tz-toast");
    if (state.toast) {
      if (!t) { t = document.createElement("div"); t.id = "tz-toast"; t.className = "toast"; document.body.appendChild(t); }
      t.textContent = state.toast;
    } else if (t) { t.remove(); }
  }
  function flash(msg) {
    state.toast = msg; showToast();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { state.toast = ""; showToast(); }, 2200);
  }
  function hashHue(str) {
    var h = 0; str = str || "zen";
    for (var i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
    return Math.abs(h) % 360;
  }
  function avatarHTML(name, size) {
    size = size || 44;
    var letter = esc((name || "?").trim().charAt(0).toUpperCase() || "?");
    var hue = hashHue(name);
    var style = "width:" + size + "px;height:" + size + "px;font-size:" + Math.round(size * 0.42) +
      "px;background:linear-gradient(140deg, hsl(" + hue + ",85%,72%), hsl(" + ((hue + 40) % 360) + ",85%,58%));box-shadow:0 0 0 2px rgba(16,185,129,0.35);";
    return '<div class="avatar" style="' + style + '">' + letter + "</div>";
  }
  var MEDALS = [
    { ring: "#fbbf24", glow: "rgba(251,191,36,0.55)", label: "GOLD", text: "#3a2a06" },
    { ring: "#d6dbe3", glow: "rgba(214,219,227,0.45)", label: "SILVER", text: "#26262c" },
    { ring: "#d97706", glow: "rgba(217,119,6,0.45)", label: "BRONZE", text: "#2e1a04" }
  ];
  function rankHTML(i) {
    var m = MEDALS[i];
    if (m) return '<div class="rank" style="background:' + m.ring + ";color:" + m.text + ";box-shadow:0 0 16px " + m.glow + ';">' + (i + 1) + "</div>";
    return '<div class="rank">' + (i + 1) + "</div>";
  }

  function configMissingHTML() {
    return '<div class="login-page"><div class="card login-box"><div class="eyebrow en">SETUP REQUIRED</div>' +
      '<h1 style="font-size:22px;">Firebase is not connected yet</h1>' +
      '<p class="sub" style="text-align:left;">Put your project details in firebaseConfig at the top of the script.</p></div></div>';
  }

  function authHTML() {
    return '<div class="login-page"><div class="card login-box"><div class="center"><div class="eyebrow en">TOPZEN CLAN COMMUNITY</div>' +
      '<h1>Welcome to <span class="glow en">TopZen</span></h1>' +
      '<p class="sub">Sign in with Discord, then link your Roblox account to verify it. No password needed.</p></div>' +
      '<button id="discord-login" class="btn-main" style="margin-top:22px;background:linear-gradient(90deg,#4752c4,#5865f2);box-shadow:0 8px 24px rgba(88,101,242,0.35);">Sign in with Discord</button></div></div>';
  }

  function bindAuth() {
    on("discord-login", function () { window.location.href = BACKEND_URL + "/auth/discord"; });
  }

  function listHTML(kind) {
    var isK = kind === "kills";
    var items = (isK ? state.site.kills : state.site.clan).slice().sort(function (a, b) {
      return isK ? b.kills - a.kills : b.points - a.points;
    });
    if (!items.length) return '<div class="empty">No entries yet</div>';
    var h = '<div class="list">';
    items.forEach(function (it, i) {
      var m = MEDALS[i];
      h += '<div class="row">' + rankHTML(i) + avatarHTML(it.name, 40);
      h += '<div class="row-info"><div class="row-name">' + esc(it.name);
      if (state.user.displayName && it.name === state.user.displayName) h += '<span class="you-badge">You</span>';
      h += "</div>";
      if (m) h += '<div class="medal-label" style="color:' + m.ring + ';">' + m.label + "</div>";
      h += '</div><div class="row-val"><div class="num">' + (isK ? it.kills : it.points) + '</div><div class="unit en">' + (isK ? "KILLS" : "PTS") + "</div></div>";
      if (state.isAdmin) h += '<button class="row-del" data-del="' + esc(it.id) + '" data-kind="' + kind + '">✕</button>';
      h += "</div>";
    });
    return h + "</div>";
  }

  function botPanelHTML() {
    var h = '<div class="admin-title" style="margin-bottom:8px;">DISCORD BOT</div>';
    h += '<div style="font-size:12px;color:#a7f3d0;margin-bottom:8px;line-height:1.7;">Server ID: Discord → Settings → Advanced → Developer Mode, then right-click your server → Copy Server ID. Commands only go live once DISCORD_BOT_TOKEN is set on the backend.</div>';
    h += '<div class="row-btns"><input id="guild-id" placeholder="Server ID" value="' + esc(state.site.guildId) + '"/><button id="save-guild">Link</button></div>';
    h += '<div class="admin-title" style="margin:14px 0 8px;">SLASH COMMANDS</div><div class="stack">';
    (state.site.commands || []).forEach(function (c) {
      h += '<div class="row-btns"><input value="/' + esc(c.name) + ' · ' + esc(c.type) + '" disabled style="opacity:0.7;"/><button data-rm-cmd="' + esc(c.name) + '" style="background:#f87171;">Delete</button></div>';
    });
    h += '<input id="cmd-name" placeholder="command name (e.g. rules)" autocomplete="off"/>';
    h += '<input id="cmd-desc" placeholder="description" autocomplete="off"/>';
    h += '<select id="cmd-type"><option value="text">Text reply</option><option value="topkills">Top 10 Kills image (red)</option><option value="topclan">Top 10 Clan image (green)</option></select>';
    h += '<textarea id="cmd-reply" rows="3" placeholder="Reply text (for Text reply)"></textarea>';
    h += '<button id="add-cmd" class="btn-main">Add command</button></div>';
    h += '<hr style="border:0;border-top:1px solid rgba(52,211,153,0.25);margin:16px 0;"/>';
    return h;
  }

   function mainHTML() {
    var locked = !state.user.displayName || !state.user.robloxVerified;
    var h = '<div class="top-bar"><span class="en">' + esc(state.user.displayName || state.user.discord) + '</span><span style="display:flex;gap:10px;align-items:center;">';
    if (state.isAdmin) h += '<button id="mod-toggle" class="logout-btn" style="color:#34d399;">Moderation</button>';
    h += '<button id="logout-btn" class="logout-btn">Log out</button></span></div>';

    if (state.isAdmin && state.showMod) {
      h += '<div class="card" style="margin:14px 20px;"><div class="admin-title" style="margin-bottom:10px;">Moderation panel</div>';
      if (state.isOwner) {
        h += botPanelHTML();
        h += '<div style="font-size:13px;color:#a7f3d0;margin-bottom:8px;">Add a new moderator (paste their UID):</div>';
        h += '<div class="row-btns"><input id="new-mod-uid" placeholder="Member UID"/><button id="add-mod">Add</button></div>';
        var admins = state.site.admins || [];
        if (admins.length) {
          h += '<div style="margin-top:10px;" class="stack">';
          admins.forEach(function (uid) {
            h += '<div class="row-btns"><input value="' + esc(uid) + '" disabled style="opacity:0.6;"/><button data-rm-mod="' + esc(uid) + '" style="background:#f87171;">Delete</button></div>';
          });
          h += "</div>";
        } else h += '<div style="font-size:12px;color:#a7f3d0;margin-top:8px;">No moderators added yet (besides the owner)</div>';
      } else h += '<div style="font-size:13px;color:#a7f3d0;">You are a moderator â€” you can edit the leaderboards below.</div>';
      h += "</div>";
    }

    if (state.isAdmin) {
      h += '<button id="members-toggle" class="members-toggle">Members ðŸ‘¥</button>';
      h += '<div id="members-overlay" class="members-overlay ' + (state.showMembers ? "open" : "") + '"></div>';
      h += '<div class="members-panel ' + (state.showMembers ? "open" : "") + '"><div class="members-head"><h2>Site members (' + state.members.length + ')</h2><button id="members-close" class="members-close">âœ•</button></div>';
      if (!state.members.length) h += '<div class="member-empty">No registered members yet</div>';
      else state.members.forEach(function (m) {
        h += '<div class="member-row"><div class="member-name">' + avatarHTML(m.displayName || m.email, 28) + esc(m.displayName || "No name yet") + "</div>";
        h += '<div class="member-meta">Roblox: <b>' + esc(m.roblox || "â€”") + (m.robloxVerified ? " âœ“" : "") + "</b><br/>Discord: <b>" + esc(m.discord || "â€”") + (m.discordVerified ? " âœ“" : "") + "</b><br/>" + esc(m.email || "") + "</div></div>";
      });
      h += "</div>";
      h += '<div class="uid-box"><b>You are the site owner âœ“</b><br/>UID: ' + esc(state.user.uid) + "</div>";
    }

    h += '<div class="wrap"><div class="center" style="padding-top:8px;padding-bottom:18px;">';
    h += '<div class="eyebrow en">TOPZEN CLAN COMMUNITY <span class="dot"></span></div><h1>TOP <span class="glow en">ZEN</span></h1>';
    h += '<p class="sub">Follow the best players, kills, and the overall clan ranking</p></div>';

    if (!state.user.robloxVerified) {
      h += '<div class="card gate"><p>Link your Roblox account to verify it and unlock the site. You approve on Roblox â€” we never see your password.</p>';
      h += '<button id="link-roblox" class="btn-main">Link Roblox account</button></div>';
    } else if (locked) {
      h += '<div class="card gate"><p>One last step before you can use the site:</p>';
      h += '<form id="name-form" class="gate-form"><input id="in-name" placeholder="Your name" autocomplete="off"/><button type="submit">Save</button></form></div>';
    }

    h += '<div class="' + (locked ? "locked" : "") + '">';
    h += '<div class="leader"><div class="eyebrow en">CLAN LEADER</div><div class="leader-name">' + avatarHTML(state.site.clanLeader, 36) + esc(state.site.clanLeader) + "</div></div>";
    if (state.isAdmin) {
      h += '<div class="card stack" style="margin-bottom:16px;"><div style="font-size:14px;font-weight:800;color:#a7f3d0;">Change clan leader</div>';
      h += '<div class="row-btns"><input id="leader-input" value="' + esc(state.site.clanLeader) + '"/><button id="save-leader">Save</button></div></div>';
    }
    h += '<div class="tabs"><button class="tab-btn ' + (state.tab === "kills" ? "active" : "") + '" data-tab="kills">Top Kills</button>';
    h += '<button class="tab-btn ' + (state.tab === "clan" ? "active" : "") + '" data-tab="clan">Clan Leaderboard</button></div>';
    h += listHTML(state.tab);

    if (state.isAdmin) {
      h += '<div style="margin-top:16px;">';
      if (state.tab === "kills") {
        h += '<div class="card stack"><div style="font-size:14px;font-weight:800;color:#a7f3d0;">Add player to Top Kills</div>';
        h += '<input id="new-kill-name" placeholder="Player name" autocomplete="off"/><input id="new-kill-count" placeholder="Kills" type="number"/>';
        h += '<button id="add-kill" class="btn-main">Add</button></div>';
      } else {
        h += '<div class="card stack"><div style="font-size:14px;font-weight:800;color:#a7f3d0;">Add member to Clan Leaderboard</div>';
        h += '<input id="new-clan-name" placeholder="Member name" autocomplete="off"/><input id="new-clan-points" placeholder="Points" type="number"/>';
        h += '<button id="add-clan" class="btn-main">Add</button></div>';
      }
      h += "</div>";
    }
    return h + "</div></div>";
  }

  function saveSite(patch, msg) {
    db.collection("site").doc("data").set(patch, { merge: true })
      .then(function () { flash(msg || "Saved âœ“"); }).catch(function (err) { flash(err.message); });
  }
  function on(id, fn) { var el = document.getElementById(id); if (el) el.addEventListener("click", fn); }

  function bindMain() {
    on("logout-btn", function () { firebase.auth().signOut(); });
    on("link-roblox", function () {
      firebase.auth().currentUser.getIdToken().then(function (t) {
        window.location.href = BACKEND_URL + "/auth/roblox?idToken=" + encodeURIComponent(t);
      }).catch(function (err) { flash(err.message); });
    });
    on("mod-toggle", function () { state.showMod = !state.showMod; render(); });
    on("add-mod", function () {
      var uid = document.getElementById("new-mod-uid").value.trim();
      if (!uid) { flash("Enter the member's UID"); return; }
      saveSite({ admins: (state.site.admins || []).concat([uid]) }, "Moderator added âœ“");
    });
    document.querySelectorAll("[data-rm-mod]").forEach(function (b) {
      b.addEventListener("click", function () {
        var uid = b.getAttribute("data-rm-mod");
        saveSite({ admins: (state.site.admins || []).filter(function (a) { return a !== uid; }) }, "Moderator removed âœ“");
      });
    });
    on("members-toggle", function () { state.showMembers = true; render(); });
    on("members-close", function () { state.showMembers = false; render(); });
    on("members-overlay", function () { state.showMembers = false; render(); });

    var nf = document.getElementById("name-form");
    if (nf) nf.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = document.getElementById("in-name").value.trim();
      if (!v) { flash("Enter your name first"); return; }
      db.collection("users").doc(state.user.uid).set({ displayName: v.slice(0, 18) }, { merge: true })
        .then(function () { flash("Name saved âœ“"); }).catch(function (err) { flash("Error: " + err.message); });
    });

    document.querySelectorAll(".tab-btn").forEach(function (b) {
      b.addEventListener("click", function () { state.tab = b.getAttribute("data-tab"); render(); });
    });
    document.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-del"), kind = b.getAttribute("data-kind");
        var src = kind === "kills" ? state.site.kills : state.site.clan;
        var next = src.filter(function (x) { return String(x.id) !== id; });
        saveSite(kind === "kills" ? { kills: next } : { clan: next });
      });
    });
    on("save-guild", function () {
      var v = document.getElementById("guild-id").value.trim();
      if (v && !/^\d{15,25}$/.test(v)) { flash("Server ID must be numbers only"); return; }
      saveSite({ guildId: v }, "Server linked âœ“");
    });
    document.querySelectorAll("[data-rm-cmd]").forEach(function (b) {
      b.addEventListener("click", function () {
        var n = b.getAttribute("data-rm-cmd");
        saveSite({ commands: (state.site.commands || []).filter(function (c) { return c.name !== n; }) }, "Command deleted âœ“");
      });
    });
    on("add-cmd", function () {
      var n = document.getElementById("cmd-name").value.trim().toLowerCase().replace(/^\//, "");
      var d = document.getElementById("cmd-desc").value.trim().slice(0, 100);
      var t = document.getElementById("cmd-type").value;
      var r = document.getElementById("cmd-reply").value.trim().slice(0, 1900);
      if (!/^[a-z0-9_-]{1,32}$/.test(n)) { flash("Name: a-z, 0-9, - or _ (max 32)"); return; }
      if (!d) { flash("Add a description"); return; }
      if (t === "text" && !r) { flash("Add the reply text"); return; }
      var list = state.site.commands || [];
      if (list.some(function (c) { return c.name === n; })) { flash("That command already exists"); return; }
      if (list.length >= 25) { flash("Max 25 commands"); return; }
      saveSite({ commands: list.concat([{ name: n, description: d, type: t, reply: t === "text" ? r : "" }]) }, "Command added âœ“");
    });
    on("save-leader", function () {
      saveSite({ clanLeader: document.getElementById("leader-input").value.trim() || "ZenHQ" });
    });
    on("add-kill", function () {
      var n = document.getElementById("new-kill-name").value.trim();
      var c = document.getElementById("new-kill-count").value;
      if (!n || c === "") { flash("Fill in the name and kills"); return; }
      var next = (state.site.kills || []).concat([{ id: Date.now(), name: n, kills: parseInt(c, 10) || 0 }]);
      next.sort(function (a, b) { return b.kills - a.kills; });
      saveSite({ kills: next });
    });
    on("add-clan", function () {
      var n = document.getElementById("new-clan-name").value.trim();
      var p = document.getElementById("new-clan-points").value;
      if (!n || p === "") { flash("Fill in the name and points"); return; }
      var next = (state.site.clan || []).concat([{ id: Date.now(), name: n, points: parseInt(p, 10) || 0 }]);
      next.sort(function (a, b) { return b.points - a.points; });
      saveSite({ clan: next });
    });
  }

  function render() {
    showToast();
    if (!configReady) { root.innerHTML = configMissingHTML(); return; }
    if (state.booting) { root.innerHTML = '<div class="login-page"><div class="sub en">LOADING...</div></div>'; return; }
    if (!state.user) { root.innerHTML = authHTML(); bindAuth(); return; }
    root.innerHTML = mainHTML();
    bindMain();
  }

  function syncMembers() {
    if (state.isAdmin && !unsubMembers) {
      unsubMembers = db.collection("users").onSnapshot(function (snap) {
        var list = []; snap.forEach(function (d) { list.push(d.data()); });
        state.members = list; render();
      }, function () { unsubMembers = null; });
    } else if (!state.isAdmin && unsubMembers) {
      unsubMembers(); unsubMembers = null; state.members = [];
    }
  }
  function updateAdmin() {
    if (!state.user) { state.isOwner = false; state.isAdmin = false; syncMembers(); return; }
    state.isOwner = state.user.uid === OWNER_UID || state.user.email === OWNER_EMAIL;
    state.isAdmin = state.isOwner || (state.site.admins || []).indexOf(state.user.uid) !== -1;
    syncMembers();
  }

  if (configReady) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();

    var hp = new URLSearchParams(window.location.hash.slice(1));
    var qp = new URLSearchParams(window.location.search);
    if (hp.get("token")) firebase.auth().signInWithCustomToken(hp.get("token")).catch(function (err) { flash(err.message); });
    if (qp.get("error")) flash(qp.get("error"));
    if (qp.get("linked")) flash("Roblox account linked âœ“");
    if (hp.get("token") || qp.get("error") || qp.get("linked")) history.replaceState(null, "", window.location.pathname);

    firebase.auth().onAuthStateChanged(function (fbUser) {
      if (unsubUser) { unsubUser(); unsubUser = null; }
      if (!fbUser) { state.user = null; updateAdmin(); state.booting = false; render(); return; }
      unsubUser = db.collection("users").doc(fbUser.uid).onSnapshot(function (doc) {
        var d = doc.data() || {};
        state.user = { uid: fbUser.uid, email: fbUser.email, roblox: d.roblox || "", discord: d.discord || "", displayName: d.displayName || "", robloxVerified: !!d.robloxVerified, discordVerified: !!d.discordVerified };
        updateAdmin(); state.booting = false; render();
      }, function (err) { state.booting = false; flash(err.message); render(); });
    });

    db.collection("site").doc("data").onSnapshot(function (doc) {
      var d = doc.data();
      if (d) state.site = { clanLeader: d.clanLeader || "ZenHQ", kills: d.kills || [], clan: d.clan || [], admins: d.admins || [], commands: d.commands || [], guildId: d.guildId || "" };
      updateAdmin(); render();
    }, function (err) { flash(err.message); });
  } else {
    state.booting = false; render();
  }
})();
</script>
